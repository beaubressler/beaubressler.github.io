    title: "Beau Bressler"
    subtitle: "Hello! I am a Postdoctoral Associate at Yale's Institution for Social and Policy Studies, where I am part of the Government Effectiveness Working Group. I study housing, urban policy, and land use regulation, both historically and today.<br><br>I received my Ph.D. in Economics from the University of California, Davis in 2026. I am currently one of three finalists for the Economic History Association's Allan Nevins Prize for the best dissertation in U.S. or Canadian economic history.<br><br>My job market paper examines how mid-century public housing reshaped American neighborhoods, using a new national dataset of the more than one million units built between 1935 and 1973. In joint work with Tianfang Cui, we study how postwar subsidies for urban planning shaped housing supply and land use regulation in the decades that followed.<br><br>You can contact me at <strong><a href=\"mailto:beau.bressler@yale.edu\">beau.bressler@yale.edu</a></strong>."
    imageUrl: "picture.jpg"
