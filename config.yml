    title: "Beau Bressler"
    subtitle: "Hello! I am a Postdoctoral Associate at Yale's <a href=\"https://isps.yale.edu/\" target=\"_blank\">Institution for Social and Policy Studies</a>, where I am part of the <a href=\"https://isps.yale.edu/government-effectiveness-working-group\" target=\"_blank\">Government Effectiveness Working Group</a>. I work on topics related to housing, urban policy, and land use regulation, both historically and today.<br><br>I received my Ph.D. in Economics from the <a href=\"https://economics.ucdavis.edu/\" target=\"_blank\">University of California, Davis</a> in 2026.<br><br>I am currently one of three finalists for the Economic History Association's <a href=\"https://eh.net/nevins-prize/\" target=\"_blank\">Allan Nevins Prize</a> for the best dissertation in U.S. or Canadian economic history.<br><br>My <strong>job market paper</strong> studies the long-run effects of the American mid-century public housing program on neighborhoods using a newly constructed national dataset.<br><br>My second chapter, joint with <a href=\"https://www.tom-cui.com/\" target=\"_blank\">Tianfang Cui</a>, examines how the 1960s Urban Planning Assistance Program reduced housing supply and institutionalized exclusionary zoning practices.<br><br>You can contact me at <strong><a href=\"mailto:beau.bressler@yale.edu\">beau.bressler@yale.edu</a></strong>."
    imageUrl: "picture.jpg"
